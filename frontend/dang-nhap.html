<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Hoc Phi</title>
    <!-- HTML là khung trang, CSS làm đẹp, JS xử lý sự kiện (bấm nút, gửi form). -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="hop hop-nho">
        <h1>Đăng nhập</h1>
        <p class="ghi-chu">Hệ thống thu học phí (dữ liệu giả, dùng cho lớp học).</p>

        <div id="thong-bao" class="thong-bao" hidden></div>

        <form id="form-dang-nhap">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="username">

            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">

            <button type="submit">Đăng nhập</button>
        </form>

        <p class="ghi-chu">Chưa có tài khoản? <a href="dang-ky.html">Đăng ký</a></p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dang-nhap.js"></script>
</body>
</html>
