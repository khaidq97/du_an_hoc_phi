<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hóa đơn - Hoc Phi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="ung-dung">
        <aside class="thanh-ben" id="thanh-ben"></aside>

        <div class="phan-chinh">
            <header class="thanh-tren" id="thanh-tren"></header>

            <main class="noi-dung">
                <div class="tieu-de-trang">
                    <div>
                        <h1>Hóa đơn</h1>
                        <p id="mo-ta-trang"></p>
                    </div>
                    <!-- Chỉ kế toán thấy hai nút này (JS bỏ thuộc tính hidden). Backend vẫn kiểm tra quyền, không tin giao diện. -->
                    <div class="nhom-nut" id="nut-ke-toan" hidden>
                        <button type="button" class="nut nut-phu" id="nut-tai-csv"></button>
                        <button type="button" class="nut nut-chinh" id="nut-tao"></button>
                    </div>
                </div>

                <section class="the" aria-label="Danh sách hóa đơn">
                    <div class="thanh-loc">
                        <label class="o-tim">
                            <span class="chi-doc-man-hinh">Tìm hóa đơn</span>
                            <span id="bieu-tuong-tim"></span>
                            <input id="o-tim" type="search" placeholder="Tìm mã hóa đơn hoặc học viên" autocomplete="off">
                        </label>

                        <div class="phan-doan" role="group" aria-label="Lọc theo trạng thái" id="loc-trang-thai">
                            <button type="button" data-gia-tri="" aria-pressed="true">Tất cả</button>
                            <button type="button" data-gia-tri="chua_dong" aria-pressed="false">Chưa đóng</button>
                            <button type="button" data-gia-tri="da_dong" aria-pressed="false">Đã đóng</button>
                        </div>

                        <div class="nhom-ngay">
                            <label>Từ <input id="tu-ngay" type="date"></label>
                            <label>đến <input id="den-ngay" type="date"></label>
                        </div>

                        <button type="button" class="nut nut-phu nut-nho" id="nut-xoa-loc" hidden>Xóa bộ lọc</button>
                    </div>

                    <div class="cuon-ngang" aria-live="polite" aria-busy="false" id="vung-bang">
                        <table class="dang-the">
                            <thead>
                                <tr>
                                    <th>Mã hóa đơn</th>
                                    <th>Học viên</th>
                                    <th class="so">Số tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Ngày tạo</th>
                                    <th>Ngày thu</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="bang-hoa-don"></tbody>
                        </table>
                        <div id="trang-thai-rong" hidden></div>
                    </div>

                    <nav class="phan-trang" aria-label="Phân trang" id="phan-trang" hidden>
                        <span id="thong-ke-trang"></span>
                        <div class="dieu-khien">
                            <label class="ghi-chu">Số dòng
                                <select id="so-dong">
                                    <option>10</option>
                                    <option selected>15</option>
                                    <option>25</option>
                                    <option>50</option>
                                </select>
                            </label>
                            <button type="button" class="nut nut-phu nut-nho" id="nut-trang-truoc" aria-label="Trang trước"></button>
                            <span id="so-trang"></span>
                            <button type="button" class="nut nut-phu nut-nho" id="nut-trang-sau" aria-label="Trang sau"></button>
                        </div>
                    </nav>
                </section>
            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/khung.js"></script>
    <script src="js/hoa-don.js"></script>
</body>
</html>
