<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - Hoc Phi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="hop hop-nho">
        <h1>Đăng ký tài khoản học viên</h1>

        <div id="thong-bao" class="thong-bao" hidden></div>

        <form id="form-dang-ky">
            <label for="ten">Họ tên</label>
            <input id="ten" name="ten" type="text" required maxlength="100">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="username">

            <label for="password">Mật khẩu (ít nhất 8 ký tự)</label>
            <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">

            <button type="submit">Đăng ký</button>
        </form>

        <p class="ghi-chu">Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dang-ky.js"></script>
</body>
</html>
